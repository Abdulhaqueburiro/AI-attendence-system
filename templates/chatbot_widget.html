<div class="chatbot-fab" id="chatbotFab" onclick="toggleChatbot()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</div>

<div class="chatbot-panel" id="chatbotPanel">
  <div class="chatbot-header">
    <div class="chatbot-header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>
      Attendance Assistant
    </div>
    <button class="chatbot-close" onclick="toggleChatbot()">&times;</button>
  </div>
  <div class="chatbot-messages" id="chatbotMessages">
    <div class="chatbot-msg bot">Hi! Ask me anything about your attendance, courses, or eligibility status.</div>
  </div>
  <div class="chatbot-input-row">
    <input type="text" id="chatbotInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter') sendChatbotMessage()">
    <button onclick="sendChatbotMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
    </button>
  </div>
</div>

<style>
  .chatbot-fab{
    position:fixed; bottom:24px; right:24px; z-index:200;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, #4AFF7A, #22C55E);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 28px -6px rgba(74,255,122,0.6);
    transition:transform 0.2s ease;
  }
  .chatbot-fab:hover{transform:scale(1.06);}
  .chatbot-fab svg{width:24px; height:24px; color:#06170C;}

  .chatbot-panel{
    position:fixed; bottom:92px; right:24px; z-index:200;
    width:340px; max-height:460px;
    background:#0D0C14;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    display:none;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 20px 50px -10px rgba(0,0,0,0.5);
  }
  .chatbot-panel.show{display:flex;}

  .chatbot-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:linear-gradient(135deg, rgba(124,58,237,0.25), rgba(74,255,122,0.12));
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .chatbot-header-title{
    display:flex; align-items:center; gap:8px;
    font-family:'Manrope', sans-serif; font-weight:700; font-size:13.5px; color:#F4F2FA;
  }
  .chatbot-header-title svg{width:15px; height:15px; color:#4AFF7A;}
  .chatbot-close{
    background:none; border:none; color:#A6A0B8; font-size:20px; cursor:pointer; line-height:1;
  }

  .chatbot-messages{
    flex:1; overflow-y:auto;
    padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
    min-height:200px;
  }
  .chatbot-msg{
    font-size:13px; line-height:1.5;
    padding:9px 13px; border-radius:12px;
    max-width:85%;
  }
  .chatbot-msg.bot{
    background:rgba(255,255,255,0.06);
    color:#F4F2FA;
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .chatbot-msg.user{
    background:linear-gradient(135deg, #4AFF7A, #22C55E);
    color:#06170C;
    align-self:flex-end;
    border-bottom-right-radius:4px;
    font-weight:500;
  }
  .chatbot-msg.typing{color:#A6A0B8; font-style:italic;}

  .chatbot-input-row{
    display:flex; align-items:center; gap:8px;
    padding:12px 14px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .chatbot-input-row input{
    flex:1; min-width:0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding:10px 12px;
    color:#F4F2FA;
    font-size:13px;
    font-family:'Inter', sans-serif;
    outline:none;
  }
  .chatbot-input-row input:focus{border-color:rgba(74,255,122,0.4);}
  .chatbot-input-row button{
    background:linear-gradient(135deg, #4AFF7A, #22C55E);
    border:none; border-radius:10px;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .chatbot-input-row button svg{width:16px; height:16px; color:#06170C;}

  @media (max-width:480px){
    .chatbot-panel{width:calc(100vw - 32px); right:16px;}
    .chatbot-fab{right:16px;}
  }
</style>

<script>
  function toggleChatbot(){
    document.getElementById('chatbotPanel').classList.toggle('show');
  }

  function appendChatMessage(sender, text, isTyping){
    const msgEl = document.createElement('div');
    msgEl.className = 'chatbot-msg ' + sender + (isTyping ? ' typing' : '');
    msgEl.textContent = text;
    if (isTyping) msgEl.id = 'chatbotTyping';
    document.getElementById('chatbotMessages').appendChild(msgEl);
    document.getElementById('chatbotMessages').scrollTop = document.getElementById('chatbotMessages').scrollHeight;
  }

  function sendChatbotMessage(){
    const input = document.getElementById('chatbotInput');
    const message = input.value.trim();
    if (!message) return;

    appendChatMessage('user', message);
    input.value = '';
    appendChatMessage('bot', 'Thinking...', true);

    const role = localStorage.getItem('student_id') ? 'student' : (localStorage.getItem('teacher_id') ? 'teacher' : null);
    const user_id = role === 'student' ? localStorage.getItem('student_id') : localStorage.getItem('teacher_id');

    fetch('/chatbot/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, role, user_id })
    })
    .then(res => res.json())
    .then(data => {
      const typingEl = document.getElementById('chatbotTyping');
      if (typingEl) typingEl.remove();
      appendChatMessage('bot', data.answer || data.error || 'Sorry, something went wrong.');
    })
    .catch(err => {
      const typingEl = document.getElementById('chatbotTyping');
      if (typingEl) typingEl.remove();
      appendChatMessage('bot', 'Connection error: ' + err);
    });
  }
</script>
